# SpacetimeDB HTTP endpoint (the local dev server) + database name.
stdb:
  base-url: http://127.0.0.1:3050
  database: builders-rpg

builders:
  # Citizens entity type for Builders. PLAYER gives a humanoid that wears a real,
  # random player skin (pulled from the verified usernames in skins.txt). Use
  # VILLAGER for a skinless fallback.
  entity-type: PLAYER
  # Seed a "starter town" of N Builders at world spawn on startup (0 to disable).
  auto-spawn: 4
